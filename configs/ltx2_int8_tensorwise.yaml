project:
  name: ltx2-int8-tensorwise-v0
  created_by: comfy_quants
  seed: 42
model:
  family: ltx2
  model_id: Lightricks/LTX-2.3
  revision: "<pin-this>"
  dtype: bf16
  source: huggingface
  trust_remote_code: false
  components:
    transformer: quantize
    text_encoder: keep_bf16
    vae: keep_bf16
quant:
  algorithm: int8_tensorwise
  target_dtype: int8_tensorwise
  scale:
    granularity: per_channel
    axis: out_features
    method: amax
  rounding: nearest_even
  modules:
    include:
      - "model.diffusion_model.transformer_blocks.*"
    # Official Lightricks FP8/NVFP4 recipe: keep the first two and last two blocks bf16.
    # Reused for INT8 so every ltx2 format quantizes the same 1,496 layers.
    exclude:
      - "model.diffusion_model.transformer_blocks.0.*"
      - "model.diffusion_model.transformer_blocks.1.*"
      - "model.diffusion_model.transformer_blocks.46.*"
      - "model.diffusion_model.transformer_blocks.47.*"
  fallback:
    on_error: keep_bf16
artifact:
  format: safetensors_quant
  compatibility_target: L2
  write_module_reports: true
