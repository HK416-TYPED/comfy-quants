project:
  name: krea2-int4-tensorwise-mixed-v0
  created_by: comfy_quants
  seed: 42
model:
  family: krea2
  model_id: krea/Krea-2-Turbo
  revision: "<pin-this>"
  dtype: bf16
  source: huggingface
  trust_remote_code: false
  components:
    transformer: quantize
    text_encoder: keep_bf16
    vae: keep_bf16
quant:
  algorithm: int4_tensorwise
  target_dtype: int4_tensorwise
  scale:
    granularity: per_channel
    axis: out_features
    method: amax
  rounding: nearest_even
  modules:
    include:
      - "blocks.*"
    exclude: []
    # Mixed W4A4 quality recipe, calibrated by per-layer leave-one-out W4A4
    # sensitivity on real sampling inputs (scripts/w4a4_layer_sensitivity.py,
    # L4 2026-07-05): swap each layer alone to W4A4, measure final-output
    # drift, then select layers by impact-per-byte under the same int8 byte
    # budget as the class-glob recipe (wv/wo/gate). Coverage of total measured
    # impact rose 40.8% -> 49.0% and turbo PSNR vs bf16 +0.95 dB at identical
    # size/speed. Composition: all wv+wk (near-free), 27/28 wo, the 4 worst
    # mlp.down, 4 gate, 4 wq, 1 mlp.up. tproj stays bf16 (outside include;
    # highest global impact per local error — modulation, never 4-bit).
    int8_fallback:
      - "blocks.0.attn.wk"
      - "blocks.0.attn.wo"
      - "blocks.0.attn.wv"
      - "blocks.0.mlp.up"
      - "blocks.1.attn.wk"
